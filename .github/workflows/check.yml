name: Prüfung
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run audit:dependencies
      - run: npm audit
      - run: npm run licenses
      - run: node scripts/reproducible.mjs
      - run: node scripts/release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: writeller-${{ matrix.os }}
          path: release/
